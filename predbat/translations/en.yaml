---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the add-on provides.
  notify_device:
    name: Notify device
    description: >-
      Home Assistant notify service used by Predbat, without the "notify."
      prefix (for example mobile_app_my_phone). Lowercase letters, digits and
      underscores only. Leave empty to disable Predbat notifications
      (notify_devices: []).
