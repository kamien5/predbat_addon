---
name: Predbat (kamien5 fork)
version: 1.7.1-kamien5.5
slug: predbat
description: Hardened fork of Predbat Home Battery Prediction and Control (Predbat v9.7.10 pinned)
url: https://github.com/kamien5/predbat_addon
ingress: True
ingress_port: 5052
ingress_root: "/"
panel_icon: mdi:bat
arch:
  - aarch64
  - amd64
# Supervisor pulls ghcr.io/kamien5/predbat-addon/{arch}:<version>. Do not use
# local build: true — it cannot prove the git SHA before the build.
image: ghcr.io/kamien5/predbat-addon/{arch}
init: false
homeassistant_api: true
hassio_api: false
map:
  - addon_config:rw
options:
  dummy: []
  notify_device: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  dummy:
    - str
  notify_device: "match(^[a-z0-9_]*$)?"
